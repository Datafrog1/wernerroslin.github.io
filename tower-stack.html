<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07110f">
  <title>Tilt Tower | Werner Roslin</title><meta name="description" content="Build a balanced tower in this responsive timing game by Werner Roslin."><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <style>
    :root{--bg:#07110f;--panel:#0d1917;--line:rgba(181,255,226,.14);--text:#f2fff9;--muted:#91a9a1;--green:#64f4bd;--gold:#ffd166;--red:#ff6b7a}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;padding:72px 14px 28px;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,rgba(68,211,158,.18),transparent 38rem),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),var(--bg);background-size:auto,32px 32px,32px 32px,auto}button,a{font:inherit}.topbar{position:fixed;inset:14px 16px auto;z-index:30;display:flex;justify-content:space-between;pointer-events:none}.topbar>*{pointer-events:auto;padding:9px 13px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:rgba(7,17,15,.92);text-decoration:none;font-size:11px;font-weight:850;cursor:pointer}.shell{width:min(780px,100%);margin:auto;padding:20px;border:1px solid var(--line);border-radius:22px;background:rgba(9,20,17,.93);box-shadow:0 30px 80px rgba(0,0,0,.4)}header{display:flex;justify-content:space-between;align-items:end;gap:18px;padding-bottom:15px;border-bottom:1px solid var(--line)}.eyebrow{margin-bottom:5px;color:var(--green);font-size:9px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(29px,5vw,43px);line-height:1;letter-spacing:-.045em}.intro{max-width:350px;color:var(--muted);font-size:11px;line-height:1.5}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.stat{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.label{display:block;color:var(--muted);font-size:8px;font-weight:900;letter-spacing:.13em}.value{display:block;margin-top:3px;color:var(--green);font-size:19px;font-weight:900}.balance .value{color:var(--gold)}.board{position:relative;width:min(520px,100%);margin:auto;overflow:hidden;border:1px solid rgba(107,220,255,.25);border-radius:15px;background:#06100e;box-shadow:0 20px 52px rgba(0,0,0,.42)}canvas{display:block;width:100%;height:auto;aspect-ratio:13/16;cursor:pointer;touch-action:manipulation}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:22px;background:rgba(3,10,8,.78);text-align:center;backdrop-filter:blur(8px)}.overlay[hidden]{display:none}.overlay h2{font-size:29px;margin-bottom:8px}.overlay p{max-width:330px;margin-bottom:17px;color:var(--muted);font-size:12px;line-height:1.55}.primary{padding:11px 28px;border:1px solid var(--green);border-radius:9px;color:#062017;background:var(--green);font-weight:900;cursor:pointer}.drop{display:block;width:min(520px,100%);margin:10px auto 0;padding:13px;border:1px solid var(--green);border-radius:10px;color:#062017;background:var(--green);font-weight:900;cursor:pointer}.hint{text-align:center;margin-top:9px;color:var(--muted);font-size:10px}
    @media(max-width:600px){body{padding:61px 7px 20px}.topbar{inset:9px 8px auto}.shell{padding:10px;border-radius:16px}header{display:block;padding:3px 3px 11px}.intro{margin-top:8px}.hud{margin:9px 0}.stat{padding:7px}.value{font-size:16px}}
  </style>
</head>
<body><nav class="topbar"><a href="portfolio.html">← Portfolio</a><button id="restart" type="button">New tower</button></nav><main class="shell"><header><div><p class="eyebrow">Werner's arcade</p><h1>Tilt Tower</h1></div><p class="intro">Time each drop carefully. Off-centre floors shift the tower's weight and make the whole structure lean.</p></header><section class="hud"><div class="stat"><span class="label">FLOORS</span><strong class="value" id="floors">0</strong></div><div class="stat"><span class="label">BEST</span><strong class="value" id="best">0</strong></div><div class="stat balance"><span class="label">BALANCE</span><strong class="value" id="balance">100%</strong></div></section><div class="board"><canvas id="game" width="520" height="640" aria-label="Tilt Tower game"></canvas><div class="overlay" id="overlay"><div><h2 id="title">Ready to build?</h2><p id="message">Press Space, click the tower or tap DROP when the moving floor is aligned.</p><button class="primary" id="start">Start building</button></div></div></div><button class="drop" id="drop" type="button">DROP FLOOR</button><p class="hint">Space / click / tap to drop</p></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=520,H=640,ui={floors:document.getElementById('floors'),best:document.getElementById('best'),balance:document.getElementById('balance'),overlay:document.getElementById('overlay'),title:document.getElementById('title'),message:document.getElementById('message'),start:document.getElementById('start')};let blocks=[],moving=null,running=false,last=0,raf,lean=0,camera=0,best=Number(localStorage.getItem('wernerTowerBest')||0),falling=[];ui.best.textContent=best;
const colors=['#64f4bd','#6bdcff','#a98bff','#ff6b9d','#ffd166','#ff9f68'];function reset(){blocks=[{x:150,y:570,w:220,h:38,offset:0,color:'#365f4d'}];lean=0;camera=0;falling=[];spawn();running=true;last=performance.now();ui.overlay.hidden=true;updateUI();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function spawn(){let top=blocks[blocks.length-1],fromLeft=blocks.length%2===1;moving={x:fromLeft?-top.w:W,y:top.y-42,w:top.w,h:36,v:(fromLeft?1:-1)*(150+Math.min(170,blocks.length*9)),color:colors[(blocks.length-1)%colors.length]}}
function drop(){if(!running||!moving)return;let base=blocks[blocks.length-1],left=Math.max(moving.x,base.x),right=Math.min(moving.x+moving.w,base.x+base.w),overlap=right-left;if(overlap<18){falling.push({...moving,vy:0,spin:(moving.x<base.x?-1:1)*1.8});moving=null;collapse('Missed the tower');return}let cut=moving.w-overlap;if(cut>1){let cutLeft=moving.x<base.x;falling.push({x:cutLeft?moving.x:right,y:moving.y,w:cut,h:moving.h,color:moving.color,vy:0,spin:cutLeft?-1.3:1.3})}let center=left+overlap/2,baseCenter=base.x+base.w/2,offset=center-baseCenter;lean+=offset*(.016+blocks.length*.0018);blocks.push({x:left,y:moving.y,w:overlap,h:moving.h,offset,color:moving.color});moving=null;if(Math.abs(lean)>14||overlap<28){collapse('The tower lost its balance');return}spawn();updateUI()}
function updateUI(){let floors=blocks.length-1,balance=Math.max(0,Math.round(100-Math.abs(lean)/14*100));ui.floors.textContent=floors;ui.best.textContent=best;ui.balance.textContent=balance+'%';ui.balance.style.color=balance<35?'#ff6b7a':balance<65?'#ffd166':'#64f4bd'}function collapse(reason){running=false;let floors=blocks.length-1;if(floors>best){best=floors;localStorage.setItem('wernerTowerBest',best)}updateUI();setTimeout(()=>{ui.title.textContent='Tower collapsed';ui.message.textContent=`${reason}. You built ${floors} floor${floors===1?'':'s'}. Best: ${best}.`;ui.start.textContent='Build again';ui.overlay.hidden=false},650)}
function update(dt){if(moving){moving.x+=moving.v*dt;if(moving.v>0&&moving.x>W-moving.w||moving.v<0&&moving.x<0){moving.v*=-1;moving.x=Math.max(0,Math.min(W-moving.w,moving.x))}}falling.forEach(f=>{f.vy+=650*dt;f.y+=f.vy*dt;f.x+=f.spin*35*dt});falling=falling.filter(f=>f.y<H+100);let topY=blocks[blocks.length-1].y;if(topY-camera<180)camera+=(topY-camera-180)*3*dt}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function draw(){ctx.fillStyle='#06100e';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(181,255,226,.045)';for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.save();ctx.translate(W/2,H-32);ctx.rotate(lean*Math.PI/180);ctx.translate(-W/2,-H+32-camera);blocks.forEach((b,i)=>{ctx.fillStyle=b.color;rounded(b.x,b.y,b.w,b.h,5);ctx.fillStyle='rgba(255,255,255,.13)';ctx.fillRect(b.x+5,b.y+5,Math.max(0,b.w-10),3)});if(moving){ctx.fillStyle=moving.color;rounded(moving.x,moving.y,moving.w,moving.h,5)}ctx.restore();falling.forEach(f=>{ctx.save();ctx.translate(f.x+f.w/2,f.y+f.h/2);ctx.rotate(f.spin*(f.y/150));ctx.fillStyle=f.color;rounded(-f.w/2,-f.h/2,f.w,f.h,4);ctx.restore()});ctx.fillStyle='rgba(100,244,189,.16)';ctx.fillRect(0,H-30,W,30)}function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(running||falling.length)raf=requestAnimationFrame(loop)}
ui.start.onclick=reset;document.getElementById('restart').onclick=()=>{ui.title.textContent='Start a new tower?';ui.message.textContent='Your current tower will be replaced.';ui.start.textContent='Start new tower';ui.overlay.hidden=false;running=false;cancelAnimationFrame(raf)};document.getElementById('drop').onclick=drop;canvas.onclick=drop;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop()}});blocks=[{x:150,y:570,w:220,h:38,offset:0,color:'#365f4d'}];moving={x:0,y:528,w:220,h:36,v:150,color:'#64f4bd'};draw();
</script></body></html>
