<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road Hopper | Werner's Arcade</title><link rel="stylesheet" href="classic-game.css"></head><body><a class="back" href="arcade.html">← Arcade</a><main class="shell"><header><div><p class="eyebrow">WERNER'S ARCADE</p><h1>Road Hopper</h1></div><p class="instructions">Use the arrow keys or buttons. Reach all five safe bays.</p></header><div class="hud"><span>SCORE <strong id="score">0</strong></span><span>LIVES <strong id="lives">3</strong></span><span>BAYS <strong id="bays">0/5</strong></span></div><div class="board"><canvas id="game" width="600" height="600"></canvas><div class="overlay" id="overlay"><div><h2 id="overTitle">Road Hopper</h2><p id="overText">Cross every lane and avoid the traffic.</p><button class="primary" id="start">Start game</button></div></div></div><div class="controls"><button data-dir="-1,0">←</button><button data-dir="0,-1">↑</button><button data-dir="1,0">→</button></div></main><script src="arcade-audio.js"></script><script>
const c=document.getElementById('game'),x=c.getContext('2d'),overlay=document.getElementById('overlay');let player,cars,score,lives,homes,running,last,raf,lock=0;function reset(){player={x:275,y:550,w:32,h:32};cars=[];score=0;lives=3;homes=new Set();for(let lane=1;lane<=7;lane++)for(let q=0;q<3;q++)cars.push({x:q*230+Math.random()*80,y:550-lane*60,w:70,h:32,v:(lane%2?1:-1)*(38+lane*6)});running=true;overlay.hidden=true;last=performance.now();arcadeSound.play('start');trackArcadeEvent?.('game_start',{game_name:'road_hopper'});raf=requestAnimationFrame(loop)}function move(dx,dy){if(!running||lock>0)return;player.x=Math.max(0,Math.min(568,player.x+dx*55));player.y=Math.max(10,Math.min(550,player.y+dy*60));lock=.11;arcadeSound.play('move')}function end(title){running=false;trackArcadeEvent?.('game_over',{game_name:'road_hopper',score});document.getElementById('overTitle').textContent=title;document.getElementById('overText').textContent=`Score ${score}`;document.getElementById('start').textContent='Play again';overlay.hidden=false;arcadeSound.play(title.includes('reached')?'level':'gameover')}function loop(now){if(!running)return;let d=Math.min(.033,(now-last)/1000);last=now;lock-=d;cars.forEach(car=>{car.x+=car.v*d;if(car.v>0&&car.x>680)car.x=-car.w;if(car.v<0&&car.x+car.w<-80)car.x=680});if(cars.some(car=>player.x<car.x+car.w&&player.x+player.w>car.x&&player.y<car.y+car.h&&player.y+player.h>car.y)){lives--;player={x:275,y:550,w:32,h:32};arcadeSound.play('hit');if(!lives){end('Road closed');return}}if(player.y<40){let bay=Math.floor((player.x+25)/120);if(!homes.has(bay)){homes.add(bay);score+=100;arcadeSound.play('point')}player={x:275,y:550,w:32,h:32};if(homes.size===5){end('All bays reached!');return}}document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('bays').textContent=homes.size+'/5';draw();raf=requestAnimationFrame(loop)}function draw(){x.fillStyle='#030908';x.fillRect(0,0,600,600);for(let i=1;i<=7;i++){x.fillStyle=i%2?'#14211d':'#101b18';x.fillRect(0,570-i*60,600,60)}x.fillStyle='#244a3b';x.fillRect(0,0,600,50);for(let i=0;i<5;i++){x.fillStyle=homes?.has(i)?'#64f4bd':'#173428';x.fillRect(i*120+35,8,50,34)}cars?.forEach((car,i)=>{x.fillStyle=i%2?'#ff6b9d':'#6bdcff';x.fillRect(car.x,car.y,car.w,car.h)});x.fillStyle='#64f4bd';x.fillRect(player?.x||275,player?.y||550,32,32)}addEventListener('keydown',e=>{const d={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[e.code];if(d){e.preventDefault();move(...d)}});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(...b.dataset.dir.split(',').map(Number)));document.getElementById('start').onclick=reset;player={x:275,y:550};cars=[];homes=new Set();draw();
</script></body></html>
