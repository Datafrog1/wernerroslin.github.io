<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07110f">
  <title>Arcade Classics | Werner Roslin</title><meta name="description" content="Four responsive arcade classics by Werner Roslin."><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <style>
    :root{--bg:#07110f;--panel:#0d1917;--line:rgba(181,255,226,.14);--text:#f2fff9;--muted:#91a9a1;--green:#64f4bd;--blue:#6bdcff;--pink:#ff6b9d;--gold:#ffd166}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;padding:70px 14px 26px;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,rgba(68,211,158,.18),transparent 38rem),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),var(--bg);background-size:auto,32px 32px,32px 32px,auto}button,a{font:inherit}.back{position:fixed;top:14px;left:16px;z-index:30;padding:9px 13px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:rgba(7,17,15,.92);text-decoration:none;font-size:11px;font-weight:850}.shell{width:min(920px,100%);margin:auto;padding:20px;border:1px solid var(--line);border-radius:22px;background:rgba(9,20,17,.93);box-shadow:0 30px 80px rgba(0,0,0,.4)}header{display:flex;justify-content:space-between;align-items:end;gap:18px;padding-bottom:15px;border-bottom:1px solid var(--line)}.eyebrow{margin-bottom:5px;color:var(--green);font-size:9px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(27px,5vw,42px);line-height:1;letter-spacing:-.04em}.intro{max-width:390px;color:var(--muted);font-size:11px;line-height:1.5}.games{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}.game-tab{padding:9px 6px;border:1px solid var(--line);border-radius:9px;color:var(--muted);background:var(--panel);font-size:10px;font-weight:850;cursor:pointer}.game-tab.active{border-color:var(--green);color:#092016;background:var(--green)}.hud{display:flex;justify-content:space-between;margin-bottom:8px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:11px;font-weight:850}.hud span:last-child{color:var(--green)}.board{position:relative;width:min(600px,100%);margin:auto;overflow:hidden;border:1px solid rgba(107,220,255,.28);border-radius:14px;background:#030908;box-shadow:0 18px 48px rgba(0,0,0,.42)}canvas{display:block;width:100%;height:auto;aspect-ratio:1;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:22px;background:rgba(3,10,8,.78);text-align:center;backdrop-filter:blur(8px)}.overlay[hidden]{display:none}.overlay h2{font-size:27px;margin-bottom:7px}.overlay p{max-width:330px;margin-bottom:16px;color:var(--muted);font-size:12px;line-height:1.5}.primary{padding:11px 25px;border:1px solid var(--green);border-radius:9px;color:#062017;background:var(--green);font-weight:900;cursor:pointer}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:min(600px,100%);margin:10px auto 0}.controls button{min-height:45px;border:1px solid var(--line);border-radius:9px;color:var(--text);background:var(--panel);font-weight:900;touch-action:none}.controls .action{color:#062017;background:var(--green)}
    @media(max-width:650px){body{padding:60px 7px 20px}.back{top:9px;left:8px}.shell{padding:10px;border-radius:16px}header{display:block;padding:3px 3px 11px}.intro{margin-top:8px}.games{grid-template-columns:repeat(2,1fr);margin:9px 0}.game-tab{padding:8px 4px}.controls button{min-height:49px}}
  </style>
</head>
<body><a class="back" href="portfolio.html">← Portfolio</a><main class="shell"><header><div><p class="eyebrow">Werner's arcade</p><h1>Arcade Classics</h1></div><p class="intro" id="intro">Four quick games, one cabinet. Choose a classic and chase your best score.</p></header><nav class="games"><button class="game-tab" data-game="pong">Paddle Duel</button><button class="game-tab" data-game="breakout">Brick Breaker</button><button class="game-tab" data-game="meteors">Meteor Field</button><button class="game-tab" data-game="hopper">Road Hopper</button></nav><div class="hud"><span id="instructions">Choose a game</span><span id="hud">SCORE 0</span></div><div class="board"><canvas id="game" width="600" height="600"></canvas><div class="overlay" id="overlay"><div><h2 id="title">Arcade Classics</h2><p id="message">Choose a game above or start with Paddle Duel.</p><button class="primary" id="start">Start game</button></div></div></div><div class="controls"><button data-key="ArrowLeft">←</button><button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button><button class="action" data-key="Space">FIRE</button></div></main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=600,H=600,ui={hud:document.getElementById('hud'),ins:document.getElementById('instructions'),over:document.getElementById('overlay'),title:document.getElementById('title'),msg:document.getElementById('message'),start:document.getElementById('start')};let game='pong',state={},keys={},running=false,last=0,raf;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y,rand=(a,b)=>a+Math.random()*(b-a);function base(){x.fillStyle='#030908';x.fillRect(0,0,W,H)}function text(t,y,s=18){x.fillStyle='#91a9a1';x.font=`800 ${s}px system-ui`;x.textAlign='center';x.fillText(t,W/2,y)}
const games={
pong:{name:'Paddle Duel',ins:'W/S or ↑/↓ · First to 7',reset(){state={py:250,ay:250,b:{x:300,y:300,vx:260,vy:150},p:0,a:0};this.serve()},serve(){state.b={x:300,y:300,vx:(Math.random()>.5?1:-1)*260,vy:rand(-170,170)}},update(d){state.py=clamp(state.py+((keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0))*330*d,0,500);state.ay=clamp(state.ay+(state.b.y-state.ay-50)*2.2*d,0,500);let b=state.b;b.x+=b.vx*d;b.y+=b.vy*d;if(b.y<8||b.y>592){b.vy*=-1;b.y=clamp(b.y,8,592)}if(b.vx<0&&hit({x:b.x-7,y:b.y-7,w:14,h:14},{x:20,y:state.py,w:15,h:100})){b.vx=Math.abs(b.vx)*1.04;b.vy+=(b.y-state.py-50)*3}if(b.vx>0&&hit({x:b.x-7,y:b.y-7,w:14,h:14},{x:565,y:state.ay,w:15,h:100})){b.vx=-Math.abs(b.vx)*1.04;b.vy+=(b.y-state.ay-50)*3}if(b.x<0){state.a++;this.serve()}if(b.x>600){state.p++;this.serve()}if(state.p===7||state.a===7)end(state.p===7?'You win!':'Computer wins',`${state.p}–${state.a}`);ui.hud.textContent=`YOU ${state.p} · ${state.a} CPU`},draw(){base();x.setLineDash([8,12]);x.strokeStyle='#244a3b';x.beginPath();x.moveTo(300,0);x.lineTo(300,600);x.stroke();x.setLineDash([]);x.fillStyle='#64f4bd';x.fillRect(20,state.py,15,100);x.fillStyle='#ff6b9d';x.fillRect(565,state.ay,15,100);x.fillStyle='#f2fff9';x.beginPath();x.arc(state.b.x,state.b.y,8,0,7);x.fill()}},
breakout:{name:'Brick Breaker',ins:'A/D or ←/→ · Clear every brick',reset(){state={pad:250,ball:{x:300,y:500,vx:210,vy:-260},bricks:[],lives:3,score:0};for(let r=0;r<6;r++)for(let q=0;q<10;q++)state.bricks.push({x:31+q*54,y:60+r*31,w:48,h:22,hp:1,row:r})},update(d){state.pad=clamp(state.pad+((keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0))*390*d,0,500);let b=state.ball;b.x+=b.vx*d;b.y+=b.vy*d;if(b.x<7||b.x>593)b.vx*=-1;if(b.y<7)b.vy=Math.abs(b.vy);if(b.vy>0&&hit({x:b.x-7,y:b.y-7,w:14,h:14},{x:state.pad,y:555,w:100,h:16})){b.vy=-Math.abs(b.vy);b.vx+=(b.x-state.pad-50)*4}for(const z of state.bricks)if(z.hp&&hit({x:b.x-7,y:b.y-7,w:14,h:14},z)){z.hp=0;b.vy*=-1;state.score+=10;break}if(b.y>610){state.lives--;state.ball={x:300,y:500,vx:210,vy:-260};if(!state.lives)end('Game over',`Score ${state.score}`)}if(state.bricks.every(z=>!z.hp))end('Wall cleared!',`Score ${state.score}`);ui.hud.textContent=`SCORE ${state.score} · LIVES ${state.lives}`},draw(){base();state.bricks.filter(z=>z.hp).forEach(z=>{x.fillStyle=['#ff6b9d','#a98bff','#6bdcff','#64f4bd','#ffd166','#ff9f68'][z.row];x.fillRect(z.x,z.y,z.w,z.h)});x.fillStyle='#64f4bd';x.fillRect(state.pad,555,100,16);x.fillStyle='#fff';x.beginPath();x.arc(state.ball.x,state.ball.y,7,0,7);x.fill()}},
meteors:{name:'Meteor Field',ins:'←/→ rotate · ↑ thrust · Space fire',reset(){state={ship:{x:300,y:300,a:-1.57,vx:0,vy:0},rocks:[],shots:[],score:0,lives:3,cool:0};for(let i=0;i<6;i++)this.rock()},rock(){let p={x:rand(0,W),y:rand(0,H),r:rand(20,38),vx:rand(-55,55),vy:rand(-55,55)};if(Math.hypot(p.x-state.ship.x,p.y-state.ship.y)<130)p.x=0;state.rocks.push(p)},update(d){let s=state.ship;s.a+=((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*3.2*d;if(keys.ArrowUp){s.vx+=Math.cos(s.a)*150*d;s.vy+=Math.sin(s.a)*150*d}s.vx*=.995;s.vy*=.995;s.x=(s.x+s.vx*d+W)%W;s.y=(s.y+s.vy*d+H)%H;state.cool-=d;if(keys.Space&&state.cool<=0){state.shots.push({x:s.x,y:s.y,vx:Math.cos(s.a)*430,vy:Math.sin(s.a)*430,life:1});state.cool=.22}state.shots.forEach(b=>{b.x=(b.x+b.vx*d+W)%W;b.y=(b.y+b.vy*d+H)%H;b.life-=d});state.rocks.forEach(r=>{r.x=(r.x+r.vx*d+W)%W;r.y=(r.y+r.vy*d+H)%H});for(const b of state.shots)for(const r of state.rocks)if(r.r&&Math.hypot(b.x-r.x,b.y-r.y)<r.r){r.r=0;b.life=0;state.score+=50}state.rocks=state.rocks.filter(r=>r.r);state.shots=state.shots.filter(b=>b.life>0);if(state.rocks.every(r=>Math.hypot(s.x-r.x,r.y-s.y)>r.r+13)===false){state.lives--;s.x=300;s.y=300;s.vx=s.vy=0;if(!state.lives)end('Ship lost',`Score ${state.score}`)}while(state.rocks.length<6+Math.floor(state.score/250))this.rock();ui.hud.textContent=`SCORE ${state.score} · LIVES ${state.lives}`},draw(){base();state.rocks.forEach(r=>{x.strokeStyle='#91a9a1';x.lineWidth=3;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()});x.fillStyle='#ffd166';state.shots.forEach(b=>x.fillRect(b.x-2,b.y-2,4,4));let s=state.ship;x.save();x.translate(s.x,s.y);x.rotate(s.a);x.strokeStyle='#64f4bd';x.lineWidth=3;x.beginPath();x.moveTo(16,0);x.lineTo(-12,-10);x.lineTo(-7,0);x.lineTo(-12,10);x.closePath();x.stroke();x.restore()}},
hopper:{name:'Road Hopper',ins:'Arrow keys / WASD · Reach five bays',reset(){state={p:{x:275,y:550,w:32,h:32},cars:[],score:0,lives:3,homes:new Set(),lock:0};for(let lane=1;lane<=7;lane++)for(let q=0;q<3;q++)state.cars.push({x:q*230+rand(0,80),y:550-lane*60,w:70,h:32,v:(lane%2?1:-1)*(70+lane*13)})},move(dx,dy){if(state.lock>0)return;state.p.x=clamp(state.p.x+dx*55,0,568);state.p.y=clamp(state.p.y+dy*60,10,550);state.lock=.12},update(d){state.lock-=d;if(keys.ArrowUp||keys.KeyW){this.move(0,-1);keys.ArrowUp=keys.KeyW=false}if(keys.ArrowDown||keys.KeyS){this.move(0,1);keys.ArrowDown=keys.KeyS=false}if(keys.ArrowLeft||keys.KeyA){this.move(-1,0);keys.ArrowLeft=keys.KeyA=false}if(keys.ArrowRight||keys.KeyD){this.move(1,0);keys.ArrowRight=keys.KeyD=false}state.cars.forEach(v=>v.x=(v.x+v.v*d+700)%700-80);if(state.cars.some(v=>hit(state.p,v))){state.lives--;state.p={x:275,y:550,w:32,h:32};if(!state.lives)end('Road closed',`Score ${state.score}`)}if(state.p.y<40){const bay=Math.floor((state.p.x+25)/120);if(!state.homes.has(bay)){state.homes.add(bay);state.score+=100}state.p={x:275,y:550,w:32,h:32};if(state.homes.size>=5)end('All bays reached!',`Score ${state.score}`)}ui.hud.textContent=`SCORE ${state.score} · LIVES ${state.lives} · BAYS ${state.homes.size}/5`},draw(){base();for(let i=1;i<=7;i++){x.fillStyle=i%2?'#14211d':'#101b18';x.fillRect(0,570-i*60,W,60)}x.fillStyle='#244a3b';x.fillRect(0,0,W,50);for(let i=0;i<5;i++){x.fillStyle=state.homes.has(i)?'#64f4bd':'#173428';x.fillRect(i*120+35,8,50,34)}state.cars.forEach((v,i)=>{x.fillStyle=i%2?'#ff6b9d':'#6bdcff';x.fillRect(v.x,v.y,v.w,v.h);x.fillStyle='#07110f';x.fillRect(v.x+12,v.y+6,18,10);x.fillRect(v.x+40,v.y+6,18,10)});x.fillStyle='#64f4bd';x.fillRect(state.p.x,state.p.y,state.p.w,state.p.h);x.fillStyle='#07110f';x.fillRect(state.p.x+7,state.p.y+7,5,5);x.fillRect(state.p.x+20,state.p.y+7,5,5)}}};
const originalHopperReset=games.hopper.reset;
games.hopper.reset=function(){originalHopperReset.call(this);state.cars.forEach(car=>car.v*=.55)};
games.hopper.update=function(d){
  state.lock-=d;
  if(keys.ArrowUp||keys.KeyW){this.move(0,-1);keys.ArrowUp=keys.KeyW=false}
  if(keys.ArrowDown||keys.KeyS){this.move(0,1);keys.ArrowDown=keys.KeyS=false}
  if(keys.ArrowLeft||keys.KeyA){this.move(-1,0);keys.ArrowLeft=keys.KeyA=false}
  if(keys.ArrowRight||keys.KeyD){this.move(1,0);keys.ArrowRight=keys.KeyD=false}
  state.cars.forEach(car=>{
    car.x+=car.v*d;
    if(car.v>0&&car.x>W+80)car.x=-car.w;
    if(car.v<0&&car.x+car.w<-80)car.x=W+80;
  });
  if(state.cars.some(car=>hit(state.p,car))){
    state.lives--;
    state.p={x:275,y:550,w:32,h:32};
    if(!state.lives)end('Road closed',`Score ${state.score}`);
  }
  if(state.p.y<40){
    const bay=Math.floor((state.p.x+25)/120);
    if(!state.homes.has(bay)){state.homes.add(bay);state.score+=100}
    state.p={x:275,y:550,w:32,h:32};
    if(state.homes.size>=5)end('All bays reached!',`Score ${state.score}`);
  }
  ui.hud.textContent=`SCORE ${state.score} · LIVES ${state.lives} · BAYS ${state.homes.size}/5`;
};

function choose(name){game=games[name]?name:'pong';document.querySelectorAll('.game-tab').forEach(b=>b.classList.toggle('active',b.dataset.game===game));ui.title.textContent=games[game].name;ui.msg.textContent=games[game].ins;ui.start.textContent='Start game';ui.ins.textContent=games[game].ins;ui.over.hidden=false;running=false;cancelAnimationFrame(raf);games[game].reset();games[game].draw();history.replaceState(null,'',`?game=${game}`)}function start(){games[game].reset();running=true;last=performance.now();ui.over.hidden=true;raf=requestAnimationFrame(loop)}function end(title,msg){running=false;ui.title.textContent=title;ui.msg.textContent=msg;ui.start.textContent='Play again';ui.over.hidden=false}function loop(now){if(!running)return;let d=Math.min(.033,(now-last)/1000);last=now;games[game].update(d);games[game].draw();if(running)raf=requestAnimationFrame(loop)}
document.querySelectorAll('.game-tab').forEach(b=>b.onclick=()=>choose(b.dataset.game));ui.start.onclick=start;addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyW','KeyA','KeyS','KeyD'].includes(e.code))e.preventDefault();keys[e.code]=true});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[k]=false});choose(new URLSearchParams(location.search).get('game')||'pong');
</script></body></html>
