<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paddle Duel | Werner's Arcade</title><link rel="stylesheet" href="classic-game.css"></head><body><a class="back" href="arcade.html">← Arcade</a><main class="shell"><header><div><p class="eyebrow">WERNER'S ARCADE</p><h1>Paddle Duel</h1></div><p class="instructions">Move with W/S or Up/Down. First to seven points wins.</p></header><div class="hud"><span>YOU <strong id="playerScore">0</strong></span><span>CPU <strong id="cpuScore">0</strong></span></div><div class="board"><canvas id="game" width="600" height="600"></canvas><div class="overlay" id="overlay"><div><h2 id="overTitle">Paddle Duel</h2><p id="overText">Return every shot and outplay the computer.</p><button class="primary" id="start">Start game</button></div></div></div><div class="controls"><button data-key="ArrowUp">↑</button><button class="action">MOVE</button><button data-key="ArrowDown">↓</button></div></main><script src="arcade-audio.js"></script><script>
const c=document.getElementById('game'),x=c.getContext('2d'),keys={},overlay=document.getElementById('overlay');let pY=250,aY=250,ball,pScore=0,aScore=0,running=false,last=0,raf;function serve(){ball={x:300,y:300,vx:(Math.random()>.5?1:-1)*260,vy:(Math.random()-.5)*330}}function reset(){pY=aY=250;pScore=aScore=0;serve();running=true;overlay.hidden=true;last=performance.now();arcadeSound.play('start');trackArcadeEvent?.('game_start',{game_name:'paddle_duel'});raf=requestAnimationFrame(loop)}function end(title){running=false;trackArcadeEvent?.('game_over',{game_name:'paddle_duel',score:pScore});document.getElementById('overTitle').textContent=title;document.getElementById('overText').textContent=`Final score ${pScore}–${aScore}`;document.getElementById('start').textContent='Play again';overlay.hidden=false;arcadeSound.play('gameover')}function loop(now){if(!running)return;let d=Math.min(.033,(now-last)/1000);last=now;pY=Math.max(0,Math.min(500,pY+((keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0))*340*d));aY=Math.max(0,Math.min(500,aY+(ball.y-aY-50)*2.1*d));ball.x+=ball.vx*d;ball.y+=ball.vy*d;if(ball.y<8||ball.y>592)ball.vy*=-1;if(ball.vx<0&&ball.x<42&&ball.y>pY&&ball.y<pY+100){ball.vx=Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-pY-50)*3;arcadeSound.play('action')}if(ball.vx>0&&ball.x>558&&ball.y>aY&&ball.y<aY+100){ball.vx=-Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-aY-50)*3}if(ball.x<0){aScore++;serve()}if(ball.x>600){pScore++;arcadeSound.play('point');serve()}document.getElementById('playerScore').textContent=pScore;document.getElementById('cpuScore').textContent=aScore;if(pScore===7||aScore===7){end(pScore===7?'You win!':'Computer wins');return}draw();raf=requestAnimationFrame(loop)}function draw(){x.fillStyle='#030908';x.fillRect(0,0,600,600);x.strokeStyle='#244a3b';x.setLineDash([8,12]);x.beginPath();x.moveTo(300,0);x.lineTo(300,600);x.stroke();x.setLineDash([]);x.fillStyle='#64f4bd';x.fillRect(20,pY,15,100);x.fillStyle='#ff6b9d';x.fillRect(565,aY,15,100);x.fillStyle='#fff';x.beginPath();x.arc(ball?.x||300,ball?.y||300,8,0,7);x.fill()}addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=()=>keys[k]=true;b.onpointerup=b.onpointerleave=()=>keys[k]=false});document.getElementById('start').onclick=reset;serve();draw();
</script></body></html>
