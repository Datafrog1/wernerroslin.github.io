<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick Breaker | Werner's Arcade</title><link rel="stylesheet" href="classic-game.css"></head><body><a class="back" href="arcade.html">← Arcade</a><main class="shell"><header><div><p class="eyebrow">WERNER'S ARCADE</p><h1>Brick Breaker</h1></div><p class="instructions">Move with A/D or Left/Right and clear the wall.</p></header><div class="hud"><span>SCORE <strong id="score">0</strong></span><span>LIVES <strong id="lives">3</strong></span></div><div class="board"><canvas id="game" width="600" height="600"></canvas><div class="overlay" id="overlay"><div><h2 id="overTitle">Brick Breaker</h2><p id="overText">Keep the ball in play and clear every brick.</p><button class="primary" id="start">Start game</button></div></div></div><div class="controls"><button data-key="ArrowLeft">←</button><button class="action">MOVE</button><button data-key="ArrowRight">→</button></div></main><script src="arcade-audio.js"></script><script>
const c=document.getElementById('game'),x=c.getContext('2d'),keys={},overlay=document.getElementById('overlay');let pad,ball,bricks,score,lives,running,last,raf;const colors=['#ff6b9d','#a98bff','#6bdcff','#64f4bd','#ffd166','#ff9f68'];function reset(){pad=250;ball={x:300,y:500,vx:210,vy:-260};score=0;lives=3;bricks=[];for(let r=0;r<6;r++)for(let q=0;q<10;q++)bricks.push({x:31+q*54,y:60+r*31,w:48,h:22,row:r,on:true});running=true;overlay.hidden=true;last=performance.now();arcadeSound.play('start');trackArcadeEvent?.('game_start',{game_name:'brick_breaker'});raf=requestAnimationFrame(loop)}function end(title){running=false;trackArcadeEvent?.('game_over',{game_name:'brick_breaker',score});document.getElementById('overTitle').textContent=title;document.getElementById('overText').textContent=`Score ${score}`;document.getElementById('start').textContent='Play again';overlay.hidden=false;arcadeSound.play(title.includes('cleared')?'level':'gameover')}function loop(now){if(!running)return;let d=Math.min(.033,(now-last)/1000);last=now;pad=Math.max(0,Math.min(500,pad+((keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0))*400*d));ball.x+=ball.vx*d;ball.y+=ball.vy*d;if(ball.x<7||ball.x>593)ball.vx*=-1;if(ball.y<7)ball.vy=Math.abs(ball.vy);if(ball.vy>0&&ball.y>543&&ball.y<580&&ball.x>pad&&ball.x<pad+100){ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-pad-50)*4;arcadeSound.play('action')}for(const b of bricks)if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.on=false;ball.vy*=-1;score+=10;arcadeSound.play('point');break}if(ball.y>610){lives--;ball={x:300,y:500,vx:210,vy:-260};if(!lives){end('Game over');return}}document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;if(bricks.every(b=>!b.on)){end('Wall cleared!');return}draw();raf=requestAnimationFrame(loop)}function draw(){x.fillStyle='#030908';x.fillRect(0,0,600,600);bricks?.filter(b=>b.on).forEach(b=>{x.fillStyle=colors[b.row];x.fillRect(b.x,b.y,b.w,b.h)});x.fillStyle='#64f4bd';x.fillRect(pad||250,555,100,16);x.fillStyle='#fff';x.beginPath();x.arc(ball?.x||300,ball?.y||500,7,0,7);x.fill()}addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=()=>keys[k]=true;b.onpointerup=b.onpointerleave=()=>keys[k]=false});document.getElementById('start').onclick=reset;pad=250;ball={x:300,y:500};bricks=[];draw();
</script></body></html>
