<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meteor Field | Werner's Arcade</title><link rel="stylesheet" href="classic-game.css"></head><body><a class="back" href="arcade.html">← Arcade</a><main class="shell"><header><div><p class="eyebrow">WERNER'S ARCADE</p><h1>Meteor Field</h1></div><p class="instructions">Rotate with Left/Right, thrust with Up and fire with Space.</p></header><div class="hud"><span>SCORE <strong id="score">0</strong></span><span>LIVES <strong id="lives">3</strong></span></div><div class="board"><canvas id="game" width="600" height="600"></canvas><div class="overlay" id="overlay"><div><h2 id="overTitle">Meteor Field</h2><p id="overText">Destroy the meteors and protect your ship.</p><button class="primary" id="start">Start game</button></div></div></div><div class="controls"><button data-key="ArrowLeft">↶</button><button class="action" data-key="Space">FIRE</button><button data-key="ArrowRight">↷</button></div></main><script src="arcade-audio.js"></script><script>
const c=document.getElementById('game'),x=c.getContext('2d'),keys={},overlay=document.getElementById('overlay');let ship,rocks,shots,score,lives,cool,inv,running,last,raf;const rnd=(a,b)=>a+Math.random()*(b-a);function rock(){let r={x:rnd(0,600),y:rnd(0,600),r:rnd(20,38),vx:rnd(-55,55),vy:rnd(-55,55)};if(Math.hypot(r.x-ship.x,r.y-ship.y)<130)r.x=0;rocks.push(r)}function reset(){ship={x:300,y:300,a:-1.57,vx:0,vy:0};rocks=[];shots=[];score=0;lives=3;cool=inv=0;for(let i=0;i<6;i++)rock();running=true;overlay.hidden=true;last=performance.now();arcadeSound.play('start');trackArcadeEvent?.('game_start',{game_name:'meteor_field'});raf=requestAnimationFrame(loop)}function end(){running=false;trackArcadeEvent?.('game_over',{game_name:'meteor_field',score});document.getElementById('overTitle').textContent='Ship lost';document.getElementById('overText').textContent=`Score ${score}`;document.getElementById('start').textContent='Play again';overlay.hidden=false;arcadeSound.play('gameover')}function fire(){if(cool>0)return;shots.push({x:ship.x,y:ship.y,vx:Math.cos(ship.a)*430,vy:Math.sin(ship.a)*430,life:1});cool=.22;arcadeSound.play('action')}function loop(now){if(!running)return;let d=Math.min(.033,(now-last)/1000);last=now;cool-=d;inv-=d;ship.a+=((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*3.2*d;if(keys.ArrowUp){ship.vx+=Math.cos(ship.a)*150*d;ship.vy+=Math.sin(ship.a)*150*d}if(keys.Space)fire();ship.x=(ship.x+ship.vx*d+600)%600;ship.y=(ship.y+ship.vy*d+600)%600;shots.forEach(b=>{b.x=(b.x+b.vx*d+600)%600;b.y=(b.y+b.vy*d+600)%600;b.life-=d});rocks.forEach(r=>{r.x=(r.x+r.vx*d+600)%600;r.y=(r.y+r.vy*d+600)%600});for(const b of shots)for(const r of rocks)if(r.r&&Math.hypot(b.x-r.x,b.y-r.y)<r.r){r.r=0;b.life=0;score+=50;arcadeSound.play('point')}rocks=rocks.filter(r=>r.r);shots=shots.filter(b=>b.life>0);if(inv<=0&&rocks.some(r=>Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+12)){lives--;inv=1.5;ship.x=ship.y=300;ship.vx=ship.vy=0;if(!lives){end();return}}while(rocks.length<6+Math.floor(score/300))rock();document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;draw();raf=requestAnimationFrame(loop)}function draw(){x.fillStyle='#030908';x.fillRect(0,0,600,600);x.strokeStyle='#91a9a1';x.lineWidth=3;rocks?.forEach(r=>{x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()});x.fillStyle='#ffd166';shots?.forEach(b=>x.fillRect(b.x-2,b.y-2,4,4));if(inv>0&&Math.floor(inv*10)%2===0)return;x.save();x.translate(ship?.x||300,ship?.y||300);x.rotate(ship?.a||0);x.strokeStyle='#64f4bd';x.beginPath();x.moveTo(16,0);x.lineTo(-12,-10);x.lineTo(-7,0);x.lineTo(-12,10);x.closePath();x.stroke();x.restore()}addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=()=>keys[k]=true;b.onpointerup=b.onpointerleave=()=>keys[k]=false});document.getElementById('start').onclick=reset;ship={x:300,y:300,a:0};rocks=[];shots=[];draw();
</script></body></html>
