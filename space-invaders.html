<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110f">
  <title>Space Defender | Werner Roslin</title>
  <meta name="description" content="A responsive Space Invaders-inspired browser game by Werner Roslin.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <style>
    :root{--bg:#07110f;--panel:#0d1917;--line:rgba(181,255,226,.14);--text:#f2fff9;--muted:#91a9a1;--green:#64f4bd;--blue:#6bdcff;--pink:#ff6b9d}
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;padding:74px 18px 30px;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,rgba(68,211,158,.18),transparent 38rem),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),var(--bg);background-size:auto,32px 32px,32px 32px,auto}button,a{font:inherit}.topbar{position:fixed;inset:15px 18px auto;z-index:30;display:flex;justify-content:space-between;pointer-events:none}.topbar>*{pointer-events:auto;padding:9px 13px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:rgba(7,17,15,.9);text-decoration:none;font-size:11px;font-weight:850;cursor:pointer;backdrop-filter:blur(12px)}.shell{width:min(920px,100%);margin:auto;padding:24px;border:1px solid var(--line);border-radius:24px;background:rgba(9,20,17,.92);box-shadow:0 32px 90px rgba(0,0,0,.42)}header{display:flex;align-items:end;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}.eyebrow{margin-bottom:6px;color:var(--green);font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(28px,5vw,44px);line-height:1;letter-spacing:-.045em}.intro{max-width:410px;color:var(--muted);font-size:12px;line-height:1.5}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.stat{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.label{display:block;color:var(--muted);font-size:8px;font-weight:900;letter-spacing:.14em}.value{display:block;margin-top:3px;color:var(--green);font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}.board{position:relative;width:min(600px,100%);margin:auto;overflow:hidden;border:1px solid rgba(107,220,255,.28);border-radius:15px;background:#030908;box-shadow:0 20px 55px rgba(0,0,0,.45)}canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:rgba(3,10,8,.78);text-align:center;backdrop-filter:blur(8px)}.overlay[hidden]{display:none}.overlay h2{font-size:30px;margin-bottom:8px}.overlay p{max-width:340px;margin-bottom:18px;color:var(--muted);line-height:1.5}.primary{padding:12px 28px;border:1px solid var(--green);border-radius:10px;color:#062017;background:var(--green);font-weight:900;cursor:pointer}.mobile-controls{display:none;grid-template-columns:1fr 1fr 1.4fr;gap:9px;width:min(600px,100%);margin:12px auto 0}.mobile-controls button{min-height:52px;border:1px solid var(--line);border-radius:11px;color:var(--text);background:var(--panel);font-size:20px;font-weight:900;touch-action:none}.mobile-controls .fire{color:#062017;background:var(--green)}
    @media(max-width:650px){body{padding:65px 8px 22px}.topbar{inset:10px 8px auto}.shell{padding:12px;border-radius:18px}header{display:block;padding:3px 3px 13px}.intro{margin-top:9px}.hud{gap:5px;margin:10px 0}.stat{padding:8px}.value{font-size:16px}.mobile-controls{display:grid}.overlay h2{font-size:25px}}
  </style>
</head>
<body>
  <nav class="topbar"><a href="arcade.html">← Arcade</a><button id="pauseBtn" type="button">Pause</button></nav>
  <main class="shell">
    <header><div><p class="eyebrow">Werner's arcade</p><h1>Space Defender</h1></div><p class="intro">Defend the sector, clear enemy waves and protect your shields. Move with A/D or arrows and fire with Space.</p></header>
    <div class="hud"><div class="stat"><span class="label">SCORE</span><strong class="value" id="score">0</strong></div><div class="stat"><span class="label">BEST</span><strong class="value" id="best">0</strong></div><div class="stat"><span class="label">WAVE</span><strong class="value" id="wave">1</strong></div><div class="stat"><span class="label">LIVES</span><strong class="value" id="lives">3</strong></div></div>
    <div class="board"><canvas id="game" width="600" height="800" aria-label="Space Defender game"></canvas><div class="overlay" id="overlay"><div><h2 id="overlayTitle">Sector ready</h2><p id="overlayText">Clear every invader before they reach your position.</p><button class="primary" id="startBtn" type="button">Start game</button></div></div></div>
    <div class="mobile-controls" aria-label="Touch controls"><button data-move="-1" aria-label="Move left">←</button><button data-move="1" aria-label="Move right">→</button><button class="fire" id="fireBtn" aria-label="Fire">FIRE</button></div>
  </main>
  <script src="arcade-audio.js"></script>
  <script>
    const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=600,H=800;
    const ui={score:document.getElementById('score'),best:document.getElementById('best'),wave:document.getElementById('wave'),lives:document.getElementById('lives'),overlay:document.getElementById('overlay'),title:document.getElementById('overlayTitle'),text:document.getElementById('overlayText'),start:document.getElementById('startBtn'),pause:document.getElementById('pauseBtn')};
    let player,shots,enemies,enemyShots,shields,stars,score,wave,lives,best=Number(localStorage.getItem('wernerSpaceBest')||0),running=false,paused=false,last=0,enemyDir=1,enemyTimer=0,fireLock=0,invulnerable=0,keys={};ui.best.textContent=best;
    const rectHit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
    function newPlayer(){return{x:W/2-24,y:H-64,w:48,h:24,speed:330}}
    function makeWave(){enemies=[];const rows=Math.min(5,3+Math.floor((wave-1)/2)),cols=9;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)enemies.push({x:62+x*54,y:95+y*46,w:34,h:24,row:y,alive:true});enemyDir=1;enemyTimer=0}
    function makeShields(){shields=[];[105,255,405].forEach(x=>{for(let y=0;y<3;y++)for(let c=0;c<5;c++)if(!(y===2&&c===2))shields.push({x:x+c*18,y:650+y*15,w:16,h:13,hp:2})})}
    function reset(){arcadeSound.play('start');window.trackArcadeEvent?.('game_start',{game_name:'space_defender'});player=newPlayer();shots=[];enemyShots=[];score=0;wave=1;lives=3;fireLock=0;invulnerable=0;stars=Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.8+.4}));makeWave();makeShields();running=true;paused=false;last=performance.now();updateHud();ui.overlay.hidden=true;ui.pause.textContent='Pause';requestAnimationFrame(loop)}
    function updateHud(){ui.score.textContent=score.toLocaleString();ui.best.textContent=best.toLocaleString();ui.wave.textContent=wave;ui.lives.textContent=lives}
    function fire(){if(!running||paused||fireLock>0)return;shots.push({x:player.x+player.w/2-2,y:player.y-10,w:4,h:15});fireLock=.24;arcadeSound.play('action')}
    function enemyFire(){const alive=enemies.filter(e=>e.alive);if(!alive.length)return;const shooter=alive[Math.floor(Math.random()*alive.length)];enemyShots.push({x:shooter.x+shooter.w/2-2,y:shooter.y+shooter.h,w:5,h:13})}
    function update(dt){fireLock=Math.max(0,fireLock-dt);invulnerable=Math.max(0,invulnerable-dt);const move=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);player.x=Math.max(10,Math.min(W-player.w-10,player.x+move*player.speed*dt));if(keys.Space)fire();shots.forEach(s=>s.y-=560*dt);enemyShots.forEach(s=>s.y+=(250+wave*12)*dt);shots=shots.filter(s=>s.y>-20);enemyShots=enemyShots.filter(s=>s.y<H+20);
      const alive=enemies.filter(e=>e.alive);if(alive.length){const speed=22+wave*5+(45-alive.length)*.65;let edge=false;alive.forEach(e=>{e.x+=enemyDir*speed*dt;if(e.x<12||e.x+e.w>W-12)edge=true});if(edge){enemyDir*=-1;alive.forEach(e=>{e.x+=enemyDir*speed*dt;e.y+=18})}enemyTimer-=dt;if(enemyTimer<=0){enemyFire();enemyTimer=Math.max(.28,1.2-wave*.06-Math.random()*.35)}if(alive.some(e=>e.y+e.h>=player.y)){finish();return}}
      shots.forEach(s=>{enemies.forEach(e=>{if(e.alive&&rectHit(s,e)){e.alive=false;s.y=-99;score+=(5-e.row)*10}});shields.forEach(b=>{if(b.hp&&rectHit(s,b)){b.hp--;s.y=-99}})});enemyShots.forEach(s=>{shields.forEach(b=>{if(b.hp&&rectHit(s,b)){b.hp--;s.y=H+99}});if(invulnerable<=0&&rectHit(s,player)){s.y=H+99;lives--;invulnerable=1.4;updateHud();if(lives<=0){finish();return}player=newPlayer()}});shields=shields.filter(b=>b.hp>0);updateHud();if(enemies.every(e=>!e.alive)){wave++;score+=250*wave;shots=[];enemyShots=[];makeWave();if(wave%3===0)makeShields();updateHud()}}
    function drawShip(){if(invulnerable>0&&Math.floor(invulnerable*10)%2===0)return;ctx.fillStyle='#64f4bd';ctx.beginPath();ctx.moveTo(player.x+player.w/2,player.y);ctx.lineTo(player.x+player.w,player.y+player.h);ctx.lineTo(player.x,player.y+player.h);ctx.closePath();ctx.fill();ctx.fillStyle='#6bdcff';ctx.fillRect(player.x+18,player.y+9,12,13)}
    function drawEnemy(e){ctx.fillStyle=['#ff6b9d','#a98bff','#6bdcff','#64f4bd','#ffd166'][e.row%5];ctx.fillRect(e.x+6,e.y,e.w-12,5);ctx.fillRect(e.x,e.y+5,e.w,e.h-10);ctx.fillRect(e.x+5,e.y+e.h-5,7,5);ctx.fillRect(e.x+e.w-12,e.y+e.h-5,7,5);ctx.fillStyle='#07110f';ctx.fillRect(e.x+8,e.y+10,5,5);ctx.fillRect(e.x+e.w-13,e.y+10,5,5)}
    function draw(){ctx.fillStyle='#030908';ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.fillStyle=`rgba(190,255,235,${.25+s.s/3})`;ctx.fillRect(s.x,s.y,s.s,s.s)});ctx.strokeStyle='rgba(100,244,189,.15)';ctx.beginPath();ctx.moveTo(0,710);ctx.lineTo(W,710);ctx.stroke();shields.forEach(b=>{ctx.fillStyle=b.hp===2?'#43c993':'#267d60';ctx.fillRect(b.x,b.y,b.w,b.h)});enemies.filter(e=>e.alive).forEach(drawEnemy);ctx.fillStyle='#64f4bd';shots.forEach(s=>ctx.fillRect(s.x,s.y,s.w,s.h));ctx.fillStyle='#ff6b9d';enemyShots.forEach(s=>ctx.fillRect(s.x,s.y,s.w,s.h));drawShip()}
    function loop(now){if(!running||paused)return;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}
    function finish(){running=false;arcadeSound.play('gameover');window.trackArcadeEvent?.('game_over',{game_name:'space_defender',score,wave});if(score>best){best=score;localStorage.setItem('wernerSpaceBest',best)}updateHud();ui.title.textContent='Sector lost';ui.text.textContent=`Score ${score.toLocaleString()} · Wave ${wave}. Ready for another run?`;ui.start.textContent='Play again';ui.overlay.hidden=false}
    function togglePause(){if(!running)return;paused=!paused;ui.pause.textContent=paused?'Resume':'Pause';if(paused){ui.title.textContent='Paused';ui.text.textContent='The sector will wait for you.';ui.start.textContent='Resume';ui.overlay.hidden=false}else{ui.overlay.hidden=true;last=performance.now();requestAnimationFrame(loop)}}
    addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyP')togglePause()});addEventListener('keyup',e=>keys[e.code]=false);
    ui.start.onclick=()=>paused?togglePause():reset();ui.pause.onclick=togglePause;document.getElementById('fireBtn').onpointerdown=e=>{e.preventDefault();fire()};document.querySelectorAll('[data-move]').forEach(b=>{const k=Number(b.dataset.move)<0?'ArrowLeft':'ArrowRight';b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[k]=false});
    player=newPlayer();shots=[];enemyShots=[];score=0;wave=1;lives=3;stars=Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.8+.4}));makeWave();makeShields();draw();
  </script>
</body>
</html>
